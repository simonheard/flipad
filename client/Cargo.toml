[package]
name = "flipad-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flipad-proto = { path = "../proto" }
evdev = "0.13"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
zune-jpeg = "0.5"
signal-hook = "0.3"
